<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HBD NANDINI 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--pink:#ff6b9d;--rose:#ff4081;--peach:#ffb3c6;--lavender:#c084fc;}

  body{
    font-family:'Quicksand',sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#1a0a2e 0%,#2d1057 40%,#4a1942 70%,#1a0a2e 100%);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 60px;gap:20px;
    position:relative;overflow-x:hidden;
  }

  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

  .heart-float{
    position:fixed;bottom:-60px;font-size:var(--fs,22px);
    animation:floatUp var(--dur,8s) ease-in var(--del,0s) infinite;
    pointer-events:none;z-index:1;left:var(--l,50%);opacity:.9;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:.9}
    100%{transform:translateY(-110vh) rotate(720deg);opacity:0}
  }

  .glass{
    position:relative;z-index:10;
    background:rgba(255,255,255,0.07);
    border:1.5px solid rgba(255,180,210,0.3);
    border-radius:28px;
    backdrop-filter:blur(14px);
    padding:34px 28px 26px;
    width:100%;max-width:400px;
    text-align:center;
    box-shadow:0 8px 40px rgba(255,64,129,0.2),inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .envelope-icon{font-size:3rem;animation:bounce 2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .sub-label{font-size:.85rem;letter-spacing:3px;text-transform:uppercase;color:var(--peach);margin:14px 0 4px}
  .main-title{
    font-family:'Dancing Script',cursive;
    font-size:3rem;color:#fff;
    text-shadow:0 0 20px rgba(255,107,157,.8),0 2px 4px rgba(0,0,0,.3);
    line-height:1.1;
  }
  .name-title{
    font-family:'Dancing Script',cursive;
    font-size:2.2rem;color:var(--pink);
    text-shadow:0 0 15px rgba(255,64,129,.7);
    animation:glow 2.5s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{text-shadow:0 0 15px rgba(255,64,129,.7)}50%{text-shadow:0 0 30px rgba(255,64,129,1),0 0 60px rgba(255,107,157,.5)}}

  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(255,180,210,.5),transparent)}
  .divider span{color:var(--pink);font-size:.95rem}

  .date-badge{
    display:inline-block;background:rgba(255,107,157,.2);
    border:1px solid rgba(255,107,157,.4);
    border-radius:20px;padding:6px 18px;
    font-size:.8rem;color:var(--peach);letter-spacing:1px;margin-bottom:18px;
  }

  .btn-reveal{
    width:100%;padding:14px;margin-top:8px;
    background:linear-gradient(135deg,var(--rose),var(--lavender));
    color:#fff;border:none;border-radius:16px;cursor:pointer;
    font-family:'Quicksand',sans-serif;font-size:1rem;font-weight:700;
    letter-spacing:.5px;box-shadow:0 4px 20px rgba(255,64,129,.4);
    transition:transform .2s,box-shadow .2s;
  }
  .btn-reveal:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(255,64,129,.6)}
  .btn-reveal:active{transform:translateY(0)}

  /* ── PETALS ── */
  .petal{
    position:fixed;pointer-events:none;z-index:2;
    font-size:var(--fs,18px);
    top:-40px;left:var(--l,50%);
    animation:petalFall var(--dur,7s) linear var(--del,0s) infinite;
  }
  @keyframes petalFall{
    0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:1}
    50%{transform:translateY(50vh) rotate(180deg) translateX(30px);opacity:.8}
    100%{transform:translateY(110vh) rotate(360deg) translateX(-20px);opacity:0}
  }

  /* ── MESSAGE CARD ── */
  .msg-card{
    position:relative;z-index:10;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,180,210,.25);
    border-radius:24px;backdrop-filter:blur(14px);
    padding:32px 26px;width:100%;max-width:400px;
    text-align:center;display:none;
    animation:zoomFadeIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes zoomFadeIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

  .msg-text{font-size:1rem;line-height:1.9;color:rgba(255,255,255,.92);font-weight:500;text-align:left;white-space:pre-wrap;}
  .msg-from{font-family:'Dancing Script',cursive;font-size:1.5rem;color:var(--pink);margin-top:20px;display:block;}

  /* ── POLAROID / PHOTO FRAME ── */
  .polaroid{
    background:#fff;border-radius:6px;
    padding:14px 14px 40px;margin:20px auto 0;
    width:200px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    transform:rotate(-2deg);
    position:relative;
  }
  .polaroid img{width:100%;border-radius:3px;display:block;}
  .polaroid .caption{
    position:absolute;bottom:10px;left:0;right:0;
    text-align:center;font-family:'Dancing Script',cursive;
    font-size:1rem;color:#555;
  }
  .polaroid-placeholder{
    width:100%;height:140px;
    background:linear-gradient(135deg,rgba(255,107,157,.2),rgba(192,132,252,.2));
    border-radius:3px;display:flex;align-items:center;justify-content:center;
    font-size:2.5rem;
  }

  /* ── MINI HEARTS BURST ── */
  .burst-heart{
    position:fixed;pointer-events:none;z-index:99;
    font-size:1.4rem;
    animation:burstOut .8s ease-out forwards;
  }
  @keyframes burstOut{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1.5)}
  }

  .btn-reload{
    display:inline-block;padding:10px 28px;margin-top:18px;
    background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);
    border:1.5px solid rgba(255,255,255,.2);border-radius:12px;cursor:pointer;
    font-family:'Quicksand',sans-serif;font-size:.9rem;font-weight:600;
    transition:background .2s;
  }
  .btn-reload:hover{background:rgba(255,255,255,.18)}

  /* ── CURSOR HEARTS ── */
  #cursor-trail{position:fixed;top:0;left:0;pointer-events:none;z-index:999;}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div id="hearts-container"></div>
<div id="petal-container"></div>
<canvas id="cursor-trail"></canvas>

<!-- ══ MAIN CARD ══ -->
<div class="glass" id="mainCard">
  <div class="envelope-icon">💌</div>
  <p class="sub-label">Sebuah kejutan untukmu</p>
  <h1 class="main-title">Happy Birthday</h1>
  <h2 class="name-title">Nandini Aulia.S ✨</h2>
  <div class="divider"><span>💖</span></div>
  <div class="date-badge" id="dateLabel"></div>
  <button class="btn-reveal" onclick="revealMessage()">
    💝 Buka Dsiniii beb~
  </button>
</div>

<!-- ══ MESSAGE CARD ══ -->
<div class="msg-card" id="msgCard">
  <div style="font-size:2.4rem;margin-bottom:16px;animation:bounce 2s ease-in-out infinite">🌹</div>

  <p class="msg-text" id="typedMsg"></p>
  <span class="msg-from" id="msgFrom" style="display:none"></span>

  <!-- Polaroid frame -->
  <div class="polaroid" id="polaroidFrame" style="display:none">
    <img src="cihuy.jpg" style="width:100%;border-radius:3px;display:block;">
    <span class="caption">Us 💕</span>
  </div>

  <div class="divider" style="margin-top:22px"><span>🌸</span></div>

  <!-- Interactive hearts -->
  <p style="font-size:.78rem;color:rgba(255,255,255,.35);margin-bottom:8px">Semntara pake ini duluyaa👇</p>
  <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px" id="heartBtns">
    <button onclick="sendLove(event,'💖')" style="background:rgba(255,107,157,.2);border:1.5px solid rgba(255,107,157,.4);border-radius:14px;padding:10px 16px;font-size:1.4rem;cursor:pointer;transition:transform .15s" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">💖</button>
    <button onclick="sendLove(event,'🌹')" style="background:rgba(255,107,157,.2);border:1.5px solid rgba(255,107,157,.4);border-radius:14px;padding:10px 16px;font-size:1.4rem;cursor:pointer;transition:transform .15s" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">🌹</button>
    <button onclick="sendLove(event,'💫')" style="background:rgba(255,107,157,.2);border:1.5px solid rgba(255,107,157,.4);border-radius:14px;padding:10px 16px;font-size:1.4rem;cursor:pointer;transition:transform .15s" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">💫</button>
    <button onclick="sendLove(event,'🎂')" style="background:rgba(255,107,157,.2);border:1.5px solid rgba(255,107,157,.4);border-radius:14px;padding:10px 16px;font-size:1.4rem;cursor:pointer;transition:transform .15s" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">🎂</button>
  </div>

  <button class="btn-reload" onclick="location.reload()">↩ Ulangi dari awal</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
<script>
/* ── STARS ── */
const starsEl=document.getElementById('stars');
for(let i=0;i<90;i++){
  const s=document.createElement('div');s.className='star';
  const sz=Math.random()*2.5+.8;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${Math.random()*4+2}s;--delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}

/* ── FLOATING HEARTS ── */
const heartEmojis=['💖','💗','💓','💞','🌹','✨','💫','🌸','🦋','💕'];
function spawnHeart(){
  const h=document.createElement('div');h.className='heart-float';
  h.textContent=heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
  const size=Math.random()*16+12,dur=Math.random()*7+6,del=Math.random()*2,left=Math.random()*95;
  h.style.cssText=`--fs:${size}px;--dur:${dur}s;--del:${del}s;left:${left}%`;
  document.getElementById('hearts-container').appendChild(h);
  setTimeout(()=>h.remove(),(dur+del)*1000+500);
}
setInterval(spawnHeart,900);
for(let i=0;i<4;i++) setTimeout(spawnHeart,i*200);

/* ── FALLING PETALS ── */
const petalSet=['🌸','🌺','🌷'];
function spawnPetal(){
  const p=document.createElement('div');p.className='petal';
  p.textContent=petalSet[Math.floor(Math.random()*petalSet.length)];
  const size=Math.random()*12+12,dur=Math.random()*5+5,del=Math.random()*3,left=Math.random()*100;
  p.style.cssText=`--fs:${size}px;--dur:${dur}s;--del:${del}s;left:${left}%`;
  document.getElementById('petal-container').appendChild(p);
  setTimeout(()=>p.remove(),(dur+del)*1000+500);
}
setInterval(spawnPetal,1400);

/* ── DATE ── */
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const now = new Date(2026, 4, 30);
document.getElementById('dateLabel').textContent=`${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

/* ── CONFETTI ── */
function boom(opts){
  confetti({particleCount:opts.n||80,spread:opts.s||70,origin:opts.o||{y:.6},colors:['#ff6b9d','#c084fc','#ff4081','#ffb3c6','#ffd700','#fff']});
}
boom({n:130,s:80});

/* ── TYPEWRITER ── */
const MESSAGE=`HALOOO, SENGGGG~ 🌹

Selamat ulang tahun ya! Semoga di hari spesial ini kamu bisa ngerasain betapa berartinya kamu buat semua orang di sekitarmu.

Semoga semua mimpi-mimpimu segera jadi nyata, rezeki mengalir deras kayak Air Terjun Deket rumah mu, dan hidupmu makin penuh warna & kebahagiaan. 💖

Makasih ya udah selalu ada, selalu bikin ketawa, dan selalu jadi semangat terbesar. Kamu luar biasa, dan aku bersyukur banget bisa kenal kamu!,DAN TENTUNYA TETEP BARENG BARENG TERUS 🎂✨

I love you POLLL in the world. 💌`;

const FROM=`— Rizky Alviansyah, dengan sepenuh hati 🌸 —`;

function typeText(el,text,speed,cb){
  let i=0;
  el.textContent='';
  function tick(){
    if(i<text.length){el.textContent+=text[i];i++;setTimeout(tick,speed);}
    else if(cb) cb();
  }
  tick();
}

/* ── REVEAL ── */
function revealMessage(){
  const card=document.getElementById('mainCard');
  card.style.transition='all .5s ease';
  card.style.opacity='0';
  card.style.transform='scale(.8)';
  setTimeout(()=>{
    card.style.display='none';
    const msg=document.getElementById('msgCard');
    msg.style.display='block';
    boom({n:220,s:110,o:{y:.3}});
    setTimeout(()=>boom({n:160,s:90,o:{y:.75}}),700);

    typeText(document.getElementById('typedMsg'),MESSAGE,18,()=>{
      setTimeout(()=>{
        const fromEl=document.getElementById('msgFrom');
        fromEl.style.display='block';
        typeText(fromEl,FROM,28,()=>{
          document.getElementById('polaroidFrame').style.display='block';
          boom({n:80,s:60,o:{y:.9}});
        });
      },300);
    });
  },500);
}

/* ── BURST HEARTS ON TAP ── */
function sendLove(e,emoji){
  const rect=e.currentTarget.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<8;i++){
    const h=document.createElement('div');
    h.className='burst-heart';h.textContent=emoji;
    const angle=(i/8)*Math.PI*2;
    const dist=60+Math.random()*40;
    h.style.cssText=`left:${cx}px;top:${cy}px;--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px`;
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),900);
  }
  boom({n:40,s:40,o:{x:cx/window.innerWidth,y:cy/window.innerHeight}});
}

/* ── CURSOR SPARKLE ── */
const canvas=document.getElementById('cursor-trail');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
canvas.style.cssText='position:fixed;top:0;left:0;pointer-events:none;z-index:9999;';
const ctx=canvas.getContext('2d');
const sparks=[];
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
window.addEventListener('mousemove',e=>{
  for(let i=0;i<2;i++){
    sparks.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*2,vy:(Math.random()-1)*2,life:1,size:Math.random()*4+2,color:`hsl(${Math.random()*60+300},100%,70%)`});
  }
});
function animateSparks(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=.08;s.life-=.03;
    if(s.life<=0){sparks.splice(i,1);continue;}
    ctx.globalAlpha=s.life;
    ctx.fillStyle=s.color;
    ctx.beginPath();ctx.arc(s.x,s.y,s.size*s.life,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(animateSparks);
}
animateSparks();
</script>
</body>
</html>
